[package]
name = "ember-manage"
description = "Ember management screens: downloads, Wine manager, store accounts and login, store links and deals, first-run onboarding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ember-core.workspace = true
ember-services.workspace = true
ember-engines.workspace = true
ember-launchers.workspace = true
ember-ui.workspace = true
ember-runtime.workspace = true
ember-extras.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
tokio.workspace = true
which.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
# gpui-kit/test-support pulls the GPUI Fast crates, which conflict with gpui-pre in the
# lockfile; GPUI's own test support exposes the test harness through `gpui_kit::*`.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"
# The stores' real login capture patterns, so the detection tests cannot drift from them.
ember-amazon-api.workspace = true
ember-epic-api.workspace = true
ember-gog-api.workspace = true
