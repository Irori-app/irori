[package]
name = "ember-services"
description = "Ember's backend facade: library aggregation, settings, download queue, launching and game operations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ember-core.workspace = true
ember-depot.workspace = true
ember-runtime.workspace = true
ember-extras.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
discord-rich-presence = "1.1"
once_cell.workspace = true
fuzzy-matcher.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's Inhibit, with the features GPUI already builds ashpd with.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit"] }

[dev-dependencies]
tempfile = "3"
