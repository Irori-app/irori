[package]
name = "irori-services"
description = "Irori's backend facade: library aggregation, settings, download queue, launching and game operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-secrets.workspace = true
irori-depot.workspace = true
irori-runtime.workspace = true
irori-engines.workspace = true
sysinfo.workspace = true
irori-extras.workspace = true
irori-scripts.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
discord-rich-presence = "1.1"
once_cell.workspace = true
fuzzy-matcher.workspace = true
fs4.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop portal's Inhibit, with the features GPUI already builds ashpd with.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "network_monitor"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
] }

[dev-dependencies]
tempfile = "3"
irori-depot = { workspace = true, features = ["test-server"] }
