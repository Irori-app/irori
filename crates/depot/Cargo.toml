[package]
name = "irori-depot"
description = "Download engine shared by Irori's store clients: parallel chunked downloads, resume, verification and delta updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes the in-process HTTP server used by tests of this and dependent crates.
test-server = ["dep:parking_lot"]

[dependencies]
irori-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
sha3.workspace = true
hex.workspace = true
flate2.workspace = true
fs4.workspace = true
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
parking_lot.workspace = true
