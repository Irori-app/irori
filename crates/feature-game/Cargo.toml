[package]
name = "irori-game"
description = "Game page: hero, play/install state, launch options, info, achievements, compatibility, and the install, import, uninstall, move, modify, cloud-save and log sheets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fs4.workspace = true
irori-core.workspace = true
irori-services.workspace = true
irori-engines.workspace = true
irori-ui.workspace = true
irori-runtime.workspace = true
irori-extras.workspace = true
irori-epic.workspace = true
irori-gog.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
open.workspace = true
time.workspace = true

[dev-dependencies]
# `gpui-kit/test-support` pulls the optional GPUI Fast crates into the lockfile
# (see crates/feature-library); enabling GPUI's own test support exposes
# `TestAppContext`/`VisualTestContext` through `gpui_kit::*`.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"
regex.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
tempfile = "3"
