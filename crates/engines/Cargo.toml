[package]
name = "irori-engines"
description = "Emulators and other game engines: manifests, discovery, managed installs with versions, BIOS checks and launch commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-runtime.workspace = true
irori-depot.workspace = true
url.workspace = true
reqwest.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
tracing.workspace = true
dirs.workspace = true
which.workspace = true
zip.workspace = true
md-5.workspace = true
hex.workspace = true
crc32fast = "1"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# Links game folders into converted games without developer mode.
junction = "1"

[dev-dependencies]
irori-depot = { workspace = true, features = ["test-server"] }
tempfile = "3"
