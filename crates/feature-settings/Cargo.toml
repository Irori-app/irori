[package]
name = "ember-settings"
description = "Settings screens: application settings, game defaults, per-game overrides, logs, system information"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ember-core.workspace = true
ember-services.workspace = true
ember-ui.workspace = true
ember-runtime.workspace = true
ember-extras.workspace = true
ember-epic.workspace = true
ember-bigpicture.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
once_cell.workspace = true

[dev-dependencies]
# gpui-kit/test-support pulls the GPUI Fast crates, which conflict with gpui-pre in the
# lockfile; GPUI's own test support exposes the test harness through `gpui_kit::*`.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"
regex.workspace = true
