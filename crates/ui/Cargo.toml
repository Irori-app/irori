[package]
name = "irori-ui"
description = "Shared UI layer: backend bridge, observable models, navigation, art pipeline, theme and common components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
irori-core.workspace = true
irori-services.workspace = true
irori-engines.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
image.workspace = true
sha2.workspace = true
hex.workspace = true
open.workspace = true
libc = "0.2"

[dev-dependencies]
# gpui-kit/test-support pulls the GPUI Fast crates, which conflict with gpui-pre in the
# lockfile; GPUI's own test support exposes the test harness through `gpui_kit::*`.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3.15", features = ["client_system"] }
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
x11rb = { version = "0.13.1", default-features = false }
