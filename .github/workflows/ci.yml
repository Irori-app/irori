name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
          - os: macos-15-intel
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libxcb1-dev libx11-xcb-dev \
            libudev-dev libssl-dev pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev xvfb
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-ci-profile-v1
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging regression tests
        run: python -m unittest discover -s packaging -p "test_*.py"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Tests (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --workspace --no-fail-fast --profile ci
      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --no-fail-fast --profile ci
      - name: Build desktop and sign-in helper
        run: cargo build --locked --profile ci -p irori -p irori-sign-in
      - name: Package native application
        run: python packaging/package.py --platform ${{ matrix.platform }} --binary-dir target/ci --output dist
      - name: Verify per-user Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Irori installation test'
          & ./dist/Irori/install.ps1 -Destination $destination
          foreach ($name in @('irori.exe', 'irori-sign-in.exe', 'irori.ico', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path -LiteralPath (Join-Path $destination $name))) {
              throw "Missing installed file: $name"
            }
          }
          $exe = Join-Path $destination 'irori.exe'
          $versionOutput = Join-Path $env:RUNNER_TEMP 'irori-version.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput $versionOutput
          if ($process.ExitCode -ne 0 -or (Get-Content $versionOutput -Raw) -notmatch '^irori [0-9]+\.[0-9]+\.[0-9]+') {
            throw 'Installed Irori failed to start'
          }
          foreach ($name in @('irori.exe', 'irori-sign-in.exe')) {
            $info = (Get-Item -LiteralPath (Join-Path $destination $name)).VersionInfo
            if ($info.ProductName -ne 'Irori' -or $info.FileVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') {
              throw "$name has no embedded version details"
            }
          }
          $helper = Join-Path $destination 'irori-sign-in.exe'
          $helperError = Join-Path $env:RUNNER_TEMP 'irori-helper-error.txt'
          $process = Start-Process -FilePath $helper -ArgumentList '--unsupported' -Wait -PassThru -RedirectStandardError $helperError
          if ($process.ExitCode -ne 1 -or (Get-Content $helperError -Raw) -notmatch 'unknown argument --unsupported') {
            throw 'Installed sign-in helper failed to load'
          }
          $command = (Get-Item 'HKCU:\Software\Classes\irori\shell\open\command').GetValue('')
          if ($command -ne ('"' + $exe + '" "%1"')) { throw 'Invalid URL handler' }
          $menu = [Environment]::GetFolderPath('Programs')
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut((Join-Path $menu 'Irori.lnk'))
          if ($link.TargetPath -ne $exe) { throw 'Invalid Start menu shortcut' }
      - uses: actions/upload-artifact@v4
        with:
          name: Irori-${{ matrix.os }}-unsigned
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
